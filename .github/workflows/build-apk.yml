name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VERSION_STR=$(java -version 2>&1 | head -n 1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | sed -E 's/.*"([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version is below 17."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          PRIMARY_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$PRIMARY_APK" ]; then
            echo "Primary APK path not found. Searching app/build/outputs/apk..."
            FOUND_APK=$(find app/build/outputs/apk -type f -name "app-debug.apk" | head -n 1)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              mkdir -p app/build/outputs/apk/debug
              cp "$FOUND_APK" "$PRIMARY_APK"
            fi
          fi
          if [ ! -f "$PRIMARY_APK" ]; then
            echo "Error: Expected APK file $PRIMARY_APK does not exist."
            exit 1
          fi
          if [ ! -s "$PRIMARY_APK" ]; then
            echo "Error: APK file $PRIMARY_APK is empty."
            exit 1
          fi
          case "$PRIMARY_APK" in
            *.apk) ;;
            *)
              echo "Error: $PRIMARY_APK does not end in .apk"
              exit 1
              ;;
          esac
          echo "APK successfully verified at $PRIMARY_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "Error: GitHub CLI (gh) is not available."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "Publishing release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --latest \
            "$APK_PATH"
